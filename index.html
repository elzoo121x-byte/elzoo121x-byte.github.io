<style>
:root{--bg:#0a0f1f;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--tx:#eaeefb;--mu:#a3aecb;--a1:#4f8cff;--a2:#8b5cf6;--a3:#22d3ee;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--code:#070b17;--name-font:'Playfair Display',serif;--name-size:clamp(2.2rem,9vw,4.2rem);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f6fd;--card:rgba(255,255,255,.8);--bd:rgba(20,30,70,.14);--tx:#14203f;--mu:#52607f;--code:#101830}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){--bg:#f3f6fd;--card:rgba(255,255,255,.8);--bd:rgba(20,30,70,.14);--tx:#14203f;--mu:#52607f}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.9;font-size:17px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(500px 400px at 85% 5%,rgba(139,92,246,.25),transparent),radial-gradient(500px 400px at 5% 60%,rgba(34,211,238,.16),transparent),linear-gradient(var(--bd) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/44px 44px;opacity:.9;animation:drift 18s linear infinite alternate}
@keyframes drift{to{background-position:30px 20px,-20px 40px,44px 44px,44px 44px}}
a{color:var(--a3);text-decoration:none}
#ld{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:opacity .4s}
#ld i{width:46px;height:46px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--a3);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
.bar{max-width:1100px;margin:auto;padding:8px 14px;display:flex;gap:10px;align-items:center}
.logo{font-family:var(--name-font);font-weight:800;font-size:1.15rem;white-space:nowrap;background:linear-gradient(90deg,var(--a3),var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{color:var(--mu);padding:8px 12px;border-radius:10px;white-space:nowrap;font-weight:500;min-height:40px;display:flex;align-items:center}
nav a.on,nav a:hover{color:var(--tx);background:var(--card)}
.ib{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-size:1rem}
#sq{display:block;max-width:1100px;margin:0 auto;padding:0 14px 8px}
#sq input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
main{max-width:1100px;margin:auto;padding:18px 14px 70px;min-height:70vh}
h1,h2,h3{line-height:1.4;margin:.2em 0 .5em}h2{font-size:1.5rem}h3{font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;backdrop-filter:blur(10px);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:var(--a1)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 20px;border-radius:12px;border:0;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px -10px var(--a2)}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx);box-shadow:none}.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero{display:grid;gap:26px;align-items:center;padding:14px 0 30px}@media(min-width:800px){.hero{grid-template-columns:1.3fr 1fr}}
.brand{font-family:var(--name-font);font-size:var(--name-size);font-weight:800;direction:ltr;text-align:right;line-height:1.15;margin:0;background:linear-gradient(100deg,var(--a3),var(--a1) 45%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.04em}
.tag{direction:ltr;text-align:right;color:var(--a3);letter-spacing:.14em;font-weight:700;margin:.3em 0 1em;font-size:.95rem}
.nm{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.av{width:54px;height:54px;border-radius:50%;border:2px solid var(--a3);display:grid;place-items:center;overflow:hidden;font-size:.6rem;color:var(--mu);background:var(--card);flex:none}.av img,.photo img{width:100%;height:100%;object-fit:cover}
.photo{width:min(280px,72vw);aspect-ratio:1;margin:auto;border-radius:50%;padding:6px;background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));animation:sp 14s linear infinite;position:relative}
.photo>div{position:absolute;inset:6px;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mu);font-weight:800;letter-spacing:.2em;font-size:.95rem;animation:sp 14s linear infinite reverse}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;background:rgba(79,140,255,.16);color:var(--a3);font-size:.82rem;font-weight:700;margin-inline-end:6px}
.stat{text-align:center}.stat b{display:block;font-size:1.8rem;color:var(--a3)}
.pg{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a3),var(--a2));transition:width .5s}
#lp{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:10;height:5px;background:var(--bd);border-radius:5px;margin-bottom:14px}#lp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a3),var(--a2));border-radius:5px}
.sec{margin:18px 0}.sec>h3{border-inline-start:4px solid var(--a2);padding-inline-start:10px}
.box{border-radius:14px;padding:12px 16px;margin:12px 0;border:1px solid;border-inline-start-width:5px}
.imp{background:rgba(34,211,238,.1);border-color:var(--a3)}.warn{background:rgba(251,191,36,.1);border-color:var(--warn)}.extra{background:rgba(139,92,246,.12);border-color:var(--a2)}
.box b.t{display:block}
.tw{overflow-x:auto;margin:10px 0}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:right;vertical-align:top}th{background:var(--card)}
pre{direction:ltr;text-align:left;background:var(--code);color:#d6e2ff;padding:14px;border-radius:14px;overflow-x:auto;font:14px/1.7 'JetBrains Mono',monospace;border:1px solid var(--bd);margin:8px 0}
.cp{float:left;margin:0 0 6px 0}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700}
.opt{display:block;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;min-height:46px}
.opt:hover:not([disabled]){border-color:var(--a1)}.opt.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}.opt.no{border-color:var(--bad);background:rgba(248,113,113,.15)}
.en{direction:ltr;unicode-bidi:embed;display:inline-block;font-weight:700;color:var(--a3)}
.rv{opacity:0;transform:translateY(16px);transition:.6s}.rv.in{opacity:1;transform:none}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:var(--ok);color:#04251a;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:60;pointer-events:none}#toast.s{opacity:1;transform:translate(-50%,0)}
#top{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:14px;z-index:30;display:none}
footer{text-align:center;color:var(--mu);padding:26px 14px;border-top:1px solid var(--bd)}footer b{font-family:var(--name-font);direction:ltr;display:inline-block;color:var(--tx)}
.nf{text-align:center;padding:60px 0}.nf h1{font-size:6rem;margin:0;background:linear-gradient(90deg,var(--a3),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'JetBrains Mono',monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

{h:"مقدمة: سؤال الدرس",html:`<p>في يوم واحد قد يقرأ الطالب في مصر رسائله على تطبيق تواصل، ويدفع ثمن إفطاره إلكترونيًا، وينضم إلى درس عبر الإنترنت، ويطلب كتابًا من متجر إلكتروني. قبل ثلاثين عامًا لم تكن معظم هذه الخدمات منتشرة بالصورة التي نعرفها اليوم.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>كيف تطورت تكنولوجيا المعلومات عبر مراحلها الرئيسية، وكيف غيّرت كل مرحلة المجتمع؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>في كل مرحلة أضافت تكنولوجيا المعلومات جهازًا جديدًا، وغيّرت معه طريقة تواصل المجتمع وعمله وتجارته.</div>`},
{h:"1) تاريخ تكنولوجيا المعلومات (IT)",html:`<p>تطورت التقنيات عبر مراحل متتابعة، وأصبحت الأجهزة <b>أصغر حجمًا وأكثر ترابطًا</b>. الجدول يلخص المراحل الخمس:</p><div class="tw"><table><tr><th>الفترة</th><th>التقنيات والأحداث</th><th>التأثير على المجتمع</th></tr><tr><td>الأربعينيات–الستينيات</td><td>الحواسيب الإلكترونية (ومنها ENIAC) والصمامات المفرغة</td><td>استُخدمت أساسًا للأغراض العسكرية والحسابات العلمية</td></tr><tr><td>السبعينيات–الثمانينيات</td><td>انتشار الحواسب الشخصية (PCs)</td><td>بداية استخدام الأفراد للحاسب</td></tr><tr><td>التسعينيات</td><td>إتاحة الإنترنت للاستخدام التجاري، ظهور الويب والبريد الإلكتروني</td><td>انتشار الوصول العالمي إلى المعلومات</td></tr><tr><td>العقد الأول من الألفية</td><td>ظهور الهواتف الذكية (آيفون وغيره)</td><td>انتشار سريع وواسع للإنترنت عبر الهواتف المحمولة</td></tr><tr><td>من العقد الثاني فصاعدًا</td><td>انتشار الحوسبة السحابية</td><td>تحليل البيانات الضخمة والذكاء الاصطناعي؛ تقديم موارد IT كخدمات عبر الإنترنت</td></tr></table></div><div class="box imp"><b class="t">معلومة مهمة</b>كانت الحواسب الأولى تملأ غرفة بأكملها. و«السحابة» ليست شيئًا غامضًا: هي أجهزة حقيقية في مكان حقيقي.</div>`},
{h:"قانون مور (Moore's Law)",html:`<p>قانون مور ملاحظة تاريخية تقول إن عدد الترانزستورات في الدائرة المتكاملة (الشريحة) <b>يتضاعف تقريبًا كل عامين</b>. استمر هذا الاتجاه عقودًا وأسهم في زيادة قدرات الحوسبة وتحسين أداء المعالجات.</p><div class="box warn"><b class="t">انتبه</b>قانون مور <b>ليس قانونًا فيزيائيًا ثابتًا</b>، بل اتجاه تاريخي. وتصغير مكونات الدوائر يواجه تحديات هندسية وفيزيائية، منها ازدياد تيارات التسرب وتأثيرات كمومية مثل النفق الكمومي.</div><p>لذلك يعتمد تحسين الأداء أيضًا على <b>تعدد الأنوية والمعالجة المتوازية</b> وتصميمات متخصصة. أما الحوسبة الكمومية فهي نهج مختلف قد يفيد في فئات محددة من المسائل، وليست بديلًا عامًا لكل الحواسيب التقليدية.</p>`},
{h:"2) التغيرات الاجتماعية الناتجة عن تكنولوجيا المعلومات",html:`<div class="tw"><table><tr><th>التغيير</th><th>المعنى</th></tr><tr><td>شبكات التواصل الاجتماعي <span class="en">SNS</span></td><td>منصات تتيح للمستخدمين التواصل ونشر المحتوى ومشاركته بسرعة</td></tr><tr><td>التجارة الإلكترونية <span class="en">E-commerce</span></td><td>بيع السلع والخدمات وشراؤها عبر الإنترنت (مثال: أمازون وإيباي)</td></tr><tr><td>العمل عن بُعد <span class="en">Remote Work</span></td><td>أداء المهام من المنزل أو موقع بعيد باستخدام الإنترنت</td></tr><tr><td>التعلّم عبر الإنترنت <span class="en">Online Learning</span></td><td>تقديم الدروس والمواد التعليمية عبر الإنترنت</td></tr><tr><td>الدفع غير النقدي <span class="en">Cashless Payment</span></td><td>الدفع بوسائل غير نقدية: بطاقات مصرفية، تطبيقات الهاتف، رموز QR</td></tr></table></div><div class="box imp"><b class="t">توقّف وفكّر</b>من بين هذه التغيرات الخمسة، أيها سيكون الأصعب في التخلي عنه، ولماذا؟</div>`},
{h:"3) تقنيات ناشئة بارزة",html:`<h3>أ) القيادة الذاتية</h3><p>تقنية تستخدم الذكاء الاصطناعي للمساعدة على قيادة المركبة. تستخدم المركبة <b>كاميرات ومستشعرات</b> لإدراك محيطها، ثم يعالج النظام البيانات لاتخاذ قرارات القيادة والتحكم فيها. ولأن التأخير قد يؤثر في السلامة، تُعالج بعض البيانات محليًا بـ<b>الحوسبة الطرفية</b> لتقليل زمن الاستجابة.</p><div class="box imp"><b class="t">الحوسبة الطرفية</b>معالجة البيانات على الجهاز نفسه فورًا، بدلًا من إرسالها إلى السحابة.</div><div class="box imp"><b class="t">توقّف وفكّر</b>في القيادة الذاتية، لماذا يكون من الضروري معالجة البيانات فورًا على المركبة نفسها بدلًا من إرسالها إلى السحابة؟</div><h3>ب) الواقع المعزز / الواقع الافتراضي</h3><p><b>الواقع المعزز (AR)</b>: يضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي.<br><b>الواقع الافتراضي (VR)</b>: يضع المستخدم داخل بيئة افتراضية مولّدة حاسوبيًا بالكامل.</p><h3>ج) الحوسبة الكمومية</h3><p>نهج حوسبي يستخدم خصائص ميكانيكا الكم لمعالجة المعلومات. يحمل البت التقليدي حالة واحدة، أما <b>الكيوبت (qubit)</b> فيستخدم مبدأ التراكب الكمومي.</p><div class="box warn"><b class="t">انتبه</b>قد توفر الحوسبة الكمومية تفوقًا في فئات محددة من المسائل، لكنها <b>لا تسرّع جميع أنواع الحسابات</b>.</div>`},
{h:"مثال محلول من الكتاب",html:`<p><b>السؤال:</b> رتّب مراحل تطور IT زمنيًا. <b>الحل:</b> بداية ظهور الحاسب (الأربعينيات–الستينيات) ← تسويق الإنترنت تجاريًا (التسعينيات) ← ظهور الهواتف الذكية (العقد الأول من الألفية) ← انتشار الحوسبة السحابية (من العقد الثاني فصاعدًا).</p><div class="box imp"><b class="t">الخلاصة</b>لم يقتصر أثر تكنولوجيا المعلومات على أجهزة أسرع وأصغر؛ بل امتد إلى طرق الوصول إلى المعلومات والتواصل والعمل والتعلم والدفع، وظهرت تحديات جديدة تتعلق بالأمان والإنصاف وإتاحة الوصول.</div>`},
{h:"لا يوجد كود في هذا الدرس",html:`<div class="box extra"><b class="t">معلومة إضافية</b>هذا الدرس نظري ولا يحتوي على أكواد في الكتاب. ستجد أول كود (JSON) في الفصل 3 – الدرس 2، وهو مجمّع في صفحة «الأكواد».</div>`}
],

goals:["عرّف الذكاء الاصطناعي، وميّز بين التعلّم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي.","اشرح العلاقة بين هذه المفاهيم باستخدام أمثلة مناسبة.","قيّم خطر الهلوسة وحدد إجراءً مناسبًا للتحقق من مخرجات الذكاء الاصطناعي التوليدي."],
secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>عندما تستخدم هاتفك أو حاسوبك قد يعمل الذكاء الاصطناعي في الخلفية دون أن تلاحظه: يصنّف رسائل البريد المزعجة، أو يوصي بمنتجات، أو يترجم نصًا. وقد تتفاعل معه مباشرة عبر أدوات تولّد نصوصًا أو صورًا بناءً على طلبك. كلها تطبيقات للذكاء الاصطناعي، لكنها تعتمد على <b>أساليب مختلفة</b>.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>ما هو الذكاء الاصطناعي، وكيف يرتبط التعلّم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي ببعضهم؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>الذكاء الاصطناعي مجال واسع، ويُعد التعلّم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي مفاهيم مترابطة داخله.</div>`},
{h:"1) ماهية الذكاء الاصطناعي (AI)",html:`<p><b>الذكاء الاصطناعي</b> مجال يضم أنظمة حاسوبية تستطيع تنفيذ مهام مثل: <b>التعلم من البيانات، والتنبؤ، والتعرف، وتوليد المحتوى، واتخاذ القرارات أو دعمها</b>.</p><p>أمثلة يومية: التعرف على الكلام، والتعرف على الصور، والترجمة.</p><div class="box imp"><b class="t">معلومة مهمة</b>معظم أنظمة الذكاء الاصطناعي الحالية <b>ضيقة النطاق</b>: تُصمَّم لأداء مهمة محددة أو مجموعة محدودة من المهام.</div><div class="box imp"><b class="t">قواعد أم أنماط؟</b>هناك فرق بين <b>القواعد المبرمجة صراحةً</b> وبين <b>الأنماط التي يتعلمها النموذج من البيانات</b>.</div>`},
{h:"2) العلاقة بين المفاهيم الأربعة",html:`<p>الشكل في الكتاب يوضح علاقة مبسطة: التعلّم الآلي فرع من الذكاء الاصطناعي، والتعلم العميق أسلوب ضمن التعلّم الآلي، وتعتمد غالبية تطبيقات الذكاء الاصطناعي التوليدي الحديثة على نماذج التعلم العميق.</p><div class="tw"><table><tr><th>المفهوم</th><th>التعريف</th><th>أمثلة</th></tr><tr><td>الذكاء الاصطناعي <span class="en">AI</span></td><td>مجال أنظمة حاسوبية تنفذ مهام التعلم والتنبؤ والتعرف وتوليد المحتوى</td><td>التعرف على الكلام والصور، الترجمة</td></tr><tr><td>التعلّم الآلي <span class="en">ML</span></td><td>فرع من AI تتعلم فيه النماذج أنماطًا من البيانات لإجراء تنبؤات أو تصنيفات أو دعم قرارات، بدلًا من برمجة كل قاعدة صراحةً</td><td>تصنيف الرسائل المزعجة، توصية المنتجات</td></tr><tr><td>التعلم العميق <span class="en">DL</span></td><td>أسلوب من أساليب التعلّم الآلي يعتمد على شبكات عصبية متعددة الطبقات، ويتعلم تمثيلات وأنماطًا معقدة</td><td>تحليل الصور، التعرف على الكلام</td></tr><tr><td>الشبكة العصبية الاصطناعية <span class="en">ANN</span></td><td>نموذج حاسوبي مستوحى بصورة مبسطة من ترابط العصبونات، من وحدات مترابطة تتغير أوزانها أثناء التدريب</td><td>—</td></tr><tr><td>الذكاء الاصطناعي التوليدي <span class="en">GenAI</span></td><td>أنظمة تُنشئ محتوى جديدًا (نصوص، صور، صوت، برمجيات) اعتمادًا على الأنماط التي تعلمتها من بيانات التدريب</td><td>ChatGPT، أدوات توليد الصور</td></tr></table></div><div class="box warn"><b class="t">انتبه</b>هذه علاقة تعليمية <b>مبسطة</b>؛ لا تفهمها على أنها تسلسل احتواء صارم في كل حالة، ولا على أنها تقنيات منفصلة تمامًا.</div><div class="box extra"><b class="t">معلومة إضافية</b>تشبيه يساعدك على الحفظ: الذكاء الاصطناعي كالمدينة الكبيرة، والتعلّم الآلي حي فيها، والتعلم العميق شارع في هذا الحي. (تشبيه من عندنا وليس من الكتاب.)</div>`},
{h:"الشبكات العصبية والتعلم العميق",html:`<p>الشبكة العصبية تربط بين <b>العديد من المكونات البسيطة</b>، وتتغير أوزانها أثناء التدريب لتتعلم أنماطًا من البيانات.</p><div class="box imp"><b class="t">توقّف وفكّر</b>كثيرًا ما يعتمد التعلم العميق على بيانات كبيرة نسبيًا كي يتعلم أنماطًا موثوقة. لماذا قد يواجه الذكاء الاصطناعي صعوبة مع شيء نادرًا ما رآه في بياناته؟</div>`},
{h:"الذكاء الاصطناعي التوليدي والهلوسة",html:`<p>يُنشئ الذكاء الاصطناعي التوليدي نصوصًا وصورًا ومقاطع صوتية جديدة.</p><div class="box warn"><b class="t">انتبه: الهلوسة</b>قد ينتج الذكاء الاصطناعي التوليدي نصًا <b>يبدو معقولًا لكنه غير صحيح واقعيًا</b> (تسمى هذه «الهلوسة»). لذلك يجب <b>التحقق من المخرجات ومصادرها</b> ولا تستخدمها في تقرير مدرسي كما هي.</div><div class="box imp"><b class="t">فكّر كمهندس</b>ابحث عن مثال موثق قدّم فيه ذكاء اصطناعي توليدي إجابة بدت صحيحة لكنها خاطئة، وسجّل مصدره. ثم اذكر فائدة ومخاطرة لاستخدامه في كتابة تقرير مدرسي، وأوصِ بقاعدة لاستخدامه في الواجبات مع سببين.</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>مثال:</b> ضع ○ أو × — «الذكاء الاصطناعي والتعلّم الآلي لهما المعنى نفسه» ← <b>×</b>؛ فالذكاء الاصطناعي مفهوم واسع، والتعلّم الآلي إحدى التقنيات ضمنه. و«التعلم العميق نوع من التعلّم الآلي» ← صحيحة، أي أن وصفه بأنه «مختلف تمامًا» ← <b>×</b>.</p><div class="box imp"><b class="t">الخلاصة</b>الذكاء الاصطناعي هو المجال الواسع؛ ويقع التعلّم الآلي ضمنه، ويقع التعلم العميق ضمن التعلّم الآلي، والذكاء الاصطناعي التوليدي الحالي مبني على التعلم العميق — من الفكرة الأوسع إلى الأكثر تخصصًا.</div>`}
],

secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>أصبح الذكاء الاصطناعي جزءًا من خدمات يومية كثيرة: منصة فيديو تقترح مقاطع تناسب اهتماماتك، ومساعد صوتي يجيب عن أسئلتك، وأداة تترجم نصًا. وفي الصناعة يُستخدم لتحليل الصور الطبية، والتنبؤ بأعطال الآلات، وتحسين مسارات التوصيل.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>أين يُستخدم الذكاء الاصطناعي في الحياة اليومية والصناعة، وما الذي يبرع فيه، وما الذي يتطلب الحذر؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>الذكاء الاصطناعي بارع في إيجاد الأنماط في البيانات، لكن الحكم البشري لا يزال ضروريًا عندما يتعلق الأمر بالأخلاق والخصوصية والمسؤولية.</div>`},
{h:"1) الذكاء الاصطناعي في الحياة اليومية",html:`<div class="tw"><table><tr><th>الخدمة</th><th>دور الذكاء الاصطناعي</th><th>أمثلة</th></tr><tr><td>أنظمة التوصية</td><td>التنبؤ بالتفضيلات من بيانات السلوك السابق وعرض التوصيات</td><td>يوتيوب، أمازون، سبوتيفاي</td></tr><tr><td>المساعدات الصوتية</td><td>التعرف على الصوت، وفهم الأوامر، وتنفيذها</td><td>سيري (Siri)، مساعد جوجل</td></tr><tr><td>الترجمة الآلية</td><td>ترجمة النص تلقائيًا إلى لغات مختلفة</td><td>DeepL، Google Translate</td></tr><tr><td>التعرف على الوجه</td><td>الكشف عن وجوه الأشخاص في الصور والتعرف عليها تلقائيًا</td><td>فتح الهاتف الذكي</td></tr></table></div><div class="box imp"><b class="t">نظام التوصية</b>نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض التوصيات.</div><div class="box imp"><b class="t">توقّف وفكّر</b>غالبًا ما تستخدم خدمات الذكاء الاصطناعي بياناتك الشخصية (ما تشاهده وتشتريه وتقوله). لماذا يثير هذا مخاوف بشأن الخصوصية؟ ومن ينبغي أن يقرر كيفية استخدام بياناتك؟</div>`},
{h:"2) الذكاء الاصطناعي في الصناعة",html:`<div class="tw"><table><tr><th>الصناعة</th><th>أمثلة على الاستخدام</th></tr><tr><td>الرعاية الصحية</td><td>التشخيص بالصور (الكشف عن الأمراض من صور الأشعة السينية والتصوير المقطعي)، ودعم اكتشاف الأدوية</td></tr><tr><td>الزراعة</td><td>التنبؤ بموعد الحصاد، والكشف عن الآفات والأمراض</td></tr><tr><td>التصنيع</td><td>أتمتة فحص جودة المنتج، والصيانة التنبؤية</td></tr><tr><td>الخدمات اللوجستية</td><td>تحسين مسارات التوصيل</td></tr></table></div><div class="box imp"><b class="t">الصيانة التنبؤية</b>استخدام البيانات للتنبؤ بأعطال الآلات أو المعدات قبل وقوعها.</div><div class="box imp"><b class="t">توقّف وفكّر</b>يفكر مستشفى في استخدام الذكاء الاصطناعي للتشخيص بالصور. اشرح لماذا ينبغي أن يؤكد التشخيص النهائي طبيب بشري بدلًا من تركه للذكاء الاصطناعي وحده.</div>`},
{h:"3) ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر",html:`<h3>يبرع في:</h3><ul><li>إيجاد وتصنيف الأنماط في البيانات المعقدة مثل الصور والنصوص.</li><li>التعرف على الصور والأصوات والنصوص، وتوليد بعض أنواع المحتوى.</li><li>الاستدلال الاحتمالي والتنبؤ استنادًا إلى البيانات.</li></ul><div class="box warn"><b class="t">يتطلب الحذر في:</b><ul style="margin:.3em 0"><li>القرارات ذات البعد الأخلاقي التي قد تؤدي إلى تمييز أو تحيز.</li><li>التعامل مع المعلومات الشخصية والبيانات الحساسة.</li><li>القرارات عالية الأثر وتحديد المسؤولية عن نتائجها.</li><li>دقة النتائج عندما تكون بيانات التدريب غير كافية أو غير ممثلة أو متحيزة.</li><li>توليد معلومات غير صحيحة أو غير مدعومة تبدو مقنعة (الهلوسة).</li><li>قضايا الحقوق عند استخدام أعمال محمية بحقوق المؤلف كبيانات تدريب.</li><li>مشكلة الصندوق الأسود.</li></ul></div><div class="box imp"><b class="t">مشكلة الصندوق الأسود</b>فقدان الوضوح حول كيفية اتخاذ الحكم، عندما يكون من غير الواضح كيف توصل الذكاء الاصطناعي إلى حكمه.</div><div class="box imp"><b class="t">قاعدة مهمة</b>تزداد الحاجة إلى إشراف بشري كلما ارتفع أثر الخطأ أو خطورة القرار.</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>مطابقة:</b> يوتيوب يوصي بفيديوهات ← نظام التوصية؛ التحدث إلى هاتف للتحقق من الطقس ← مساعد صوتي؛ ترجمة موقع أجنبي ← ترجمة آلية؛ كاميرا تكتشف وجهًا ← التعرف على الوجه.</p><p><b>صح/خطأ:</b> «لا بأس بترك الأحكام الأخلاقية بالكامل للذكاء الاصطناعي» ← <b>×</b>، لأن أحكامه قد تؤدي إلى التمييز أو التحيز.</p><div class="box imp"><b class="t">الخلاصة</b>يُستخدم الذكاء الاصطناعي في التوصية والمساعدات الصوتية والترجمة والتعرف على الوجه، وفي الرعاية الصحية والزراعة والتصنيع والخدمات اللوجستية. وهو يجيد اكتشاف الأنماط والتنبؤ، لكنه لا يضمن صحة النتيجة أو عدالتها؛ لذلك يزداد التحقق البشري أهمية كلما كان القرار أعلى أثرًا.</div>`}
],

topics:["التحيز الخوارزمي","قضايا الخصوصية","الذكاء الاصطناعي القابل للتفسير والمسؤولية","المبادئ الأربعة للأخلاقيات"],
goals:["شرح ماهية التحيز الخوارزمي ووصف أسبابه الرئيسية.","ربط المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي (العدالة، الشفافية، حماية الخصوصية، المساءلة) بمواقف محددة.","تقييم موقف أخلاقي يتعلق بالذكاء الاصطناعي، وتبرير قاعدة للاستخدام المسؤول وتحديد الأطراف ذات المسؤولية."],
secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>يساعد الذكاء الاصطناعي اليوم في قرارات تؤثر في الأشخاص، مثل فرز طلبات التوظيف والتعرف على الأفراد وتحليل البيانات الشخصية. وقد تنتج نتائج غير عادلة إذا كانت البيانات أو تصميم النظام أو استخدامه منحازة، وقد يصعب تفسير أساس بعض قراراته.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>ما القضايا الأخلاقية التي تنشأ مع انتشار الذكاء الاصطناعي، وما المبادئ التي ينبغي أن توجه كيفية استخدامنا له؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>إذا كانت بيانات التدريب متحيزة يمكن للذكاء الاصطناعي أن يكرر هذا التحيز في أحكامه؛ واستخدامه بمسؤولية يعني التحقق من التحيز، والقدرة على شرح القرارات، ومعرفة من هو المسؤول.</div>`},
{h:"1) التحيز الخوارزمي",html:`<p><b>التحيز في أنظمة الذكاء الاصطناعي</b> انحراف أو نمط قد يؤدي إلى نتائج غير عادلة أو ضارة، ويمكن أن ينشأ من البيانات أو تصميم النظام أو طريقة استخدامه أو السياق البشري والاجتماعي.</p><p>أمثلة: نظام توظيف يفضل فئة بصورة غير عادلة، أو نظام تعرف على الوجه تقل دقته مع فئات معينة.</p><div class="box imp"><b class="t">أسباب التحيز</b><ul style="margin:.3em 0"><li><b>بيانات تدريب متحيزة:</b> بيانات غير كافية عن سمات معينة، أو انعكاس نزعات تمييزية سابقة في البيانات.</li><li><b>طريقة بناء النظام:</b> اختيار غير مناسب للمتغيرات، أو متغير بديل يمثل بشكل غير مباشر سمة محمية، أو تصميم النموذج نفسه.</li></ul></div><div class="box imp"><b class="t">بيانات التدريب</b>هي الأمثلة التي يتعلم منها النظام أنماطه قبل الاستخدام؛ وكلما قلّ تمثيلها للواقع زاد احتمال تحيّز مخرجاته.</div>`},
{h:"2) قضايا الخصوصية",html:`<p>أدى تطور الذكاء الاصطناعي إلى قضايا جديدة تتعلق بالخصوصية:</p><ul><li><b>المراقبة بالتعرف على الوجه:</b> يمكن للكاميرات في الأماكن العامة التعرف على الأفراد وتتبعهم.</li><li><b>الجمع الجماعي للبيانات الشخصية:</b> تُجمع وتُحلَّل كميات كبيرة من بيانات السلوك عبر الإنترنت.</li></ul><div class="box imp"><b class="t">توقّف وفكّر</b>عند استخدام التعرف على الوجه في الأماكن العامة تتحسن السلامة والراحة لكن تنشأ مخاوف الخصوصية. كيف ينبغي الموازنة بينها؟ وأي مبدأ أخلاقي يرتبط بالخصوصية؟</div>`},
{h:"3) الذكاء الاصطناعي القابل للتفسير والمسؤولية",html:`<div class="tw"><table><tr><th>المصطلح</th><th>المعنى</th></tr><tr><td>الذكاء الاصطناعي القابل للتفسير <span class="en">XAI</span></td><td>أساليب تساعد البشر على فهم العوامل التي أسهمت في وصول النظام إلى مخرج أو قرار معين</td></tr><tr><td>المسؤولية <span class="en">Responsibility</span></td><td>تحديد أدوار وواجبات الأطراف (المطوّر، الجهة المشغِّلة، المستخدم)</td></tr><tr><td>المساءلة <span class="en">Accountability</span></td><td>تحديد الجهات المسؤولة عن النظام وقراراته وآثاره وإمكان محاسبتها وفق أدوارها</td></tr><tr><td>الشفافية <span class="en">Transparency</span></td><td>إتاحة معلومات واضحة ومناسبة عن النظام واستخدامه وعملية اتخاذ القرار وحدوده</td></tr></table></div><div class="box warn"><b class="t">انتبه</b>المساءلة <b>ليست</b> القدرة على شرح القرار (تلك وظيفة XAI)، بل تحديد <b>من يُحاسَب</b> على النتيجة. ولا يوجد توزيع واحد للمسؤولية يصلح لكل السياقات.</div><p>عندما تكون آلية الوصول إلى النتيجة غير واضحة، يصعب تقييمها واكتشاف الأخطاء أو التحيز.</p>`},
{h:"4) المبادئ الأربعة لأخلاقيات الذكاء الاصطناعي",html:`<div class="tw"><table><tr><th>المبدأ</th><th>الوصف</th></tr><tr><td>العدالة</td><td>عدم التمييز ظلمًا ضد أي شخص أو مجموعة</td></tr><tr><td>الشفافية</td><td>إتاحة معلومات واضحة ومناسبة عن النظام وعملية القرار وحدوده</td></tr><tr><td>حماية الخصوصية</td><td>التعامل مع المعلومات الشخصية بشكل مناسب وحمايتها</td></tr><tr><td>المساءلة</td><td>تحديد الجهات المسؤولة وإمكان محاسبتها وفق أدوارها</td></tr></table></div><p>هذه أربعة مبادئ يركز عليها الدرس <b>من بين مبادئ أخرى</b>.</p><div class="box imp"><b class="t">توقّف وفكّر</b>إذا لم يستطع أحد شرح سبب رفض الذكاء الاصطناعي لطلب توظيف شخص، فهل هذا عادل؟ أي مبدأ مفقود؟</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>صح/خطأ:</b> «حتى لو كانت عملية القرار غير واضحة لا توجد مشكلة طالما أن النتيجة صحيحة» ← <b>×</b>، لأنه يصعب التحقق من صحة النتيجة. و«من المسؤول قد تم تحديده بوضوح بالفعل» ← <b>×</b>، فالآراء تختلف باختلاف دور الشخص (مطوّر أو مستخدم أو مشغّل).</p><div class="box imp"><b class="t">الخلاصة</b>قد تنشأ النتائج غير العادلة من البيانات أو التصميم أو الاستخدام، وقد يؤدي جمع البيانات إلى مخاطر على الخصوصية، وقد يصعب تفسير بعض المخرجات أو تحديد المسؤولية عنها. لذلك يركز الدرس على العدالة والشفافية وحماية الخصوصية والمساءلة.</div>`}
],

c2l1:{desc:"كيف يعمل HTTPS، وكيف تتعاون الشهادات والتشفير والتوقيعات والمصادقة الثنائية لحماية الاتصال.",level:"متوسط",
topics:["اتصال HTTPS ومصافحة TLS","التشفير المتماثل والمفتاح العام","المصادقة الثنائية و MFA","تركيب تقنيات الأمان"],
goals:["اشرح كيف تستخدم اتصالات HTTPS تقنيات مختلفة لحماية الاتصال.","ميّز بين دور التشفير والشهادات الرقمية والمصادقة الثنائية والتوقيعات الرقمية.","قيّم طريقة مصادقة في سياق محدد وبرر اختيارك باستخدام متطلبات الأمان وإمكانية الوصول."],
secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>عندما تسجل الدخول إلى تطبيق مصرفي أو تشتري عبر الإنترنت، تعمل عدة تقنيات لحماية الاتصال: يشفّر TLS البيانات أثناء انتقالها، ويتحقق المتصفح من شهادة الموقع واسم النطاق، وتتحقق الخدمة من هوية المستخدم. تقلل هذه الوسائل المخاطر، لكنها لا تعني أن محتوى الموقع موثوق أو أن الحماية مطلقة.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>كيف تعمل تقنيات التشفير والمصادقة معًا للحفاظ على أمان الاتصال والخدمات عبر الإنترنت؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>يعتمد الاتصال والخدمات الآمنة على الجمع بين التشفير والمصادقة، وليس على تقنية واحدة فقط.</div>`},
{h:"1) كيف تعمل اتصالات HTTPS",html:`<p><b>HTTPS</b> هو بروتوكول HTTP منقول عبر اتصال <b>TLS</b> مؤمَّن. يوفر TLS <b>سرية البيانات وسلامتها</b> أثناء النقل، ويساعد المتصفح على التحقق من هوية الخادم واسم النطاق. وتسمى خطوات إنشاء الاتصال الآمن <b>مصافحة TLS</b>.</p><div class="tw"><table><tr><th>المرحلة</th><th>ما يحدث</th><th>آلية الحماية</th></tr><tr><td>1) التحقق من الشهادة</td><td>الخادم يرسل شهادته الرقمية، والمتصفح يتحقق من صلاحيتها وسلسلة الثقة وملاءمتها لاسم الموقع</td><td>التشفير بالمفتاح العام</td></tr><tr><td>2) اشتقاق مفاتيح الجلسة</td><td>يتفاوض الطرفان على أسرار مشتركة تُشتق منها مفاتيح الجلسة، دون إرسال المفتاح نفسه عبر الشبكة</td><td>التشفير بالمفتاح العام</td></tr><tr><td>3) تبادل البيانات</td><td>تُحمى بيانات الجلسة بالتشفير المتماثل وآليات سلامة البيانات</td><td>التشفير المتماثل</td></tr></table></div><div class="box imp"><b class="t">معلومة مهمة</b>يستخدم التشفير بالمفتاح العام زوجًا من المفاتيح: <b>مفتاحًا عامًا ومفتاحًا خاصًا</b>. المفتاح العام للمصادقة والاتفاق الآمن على مفاتيح الجلسة، أما التشفير المتماثل فلحماية بيانات الجلسة <b>بسرعة وكفاءة</b>.</div><div class="box warn"><b class="t">انتبه</b>لا تُرسَل جميع البيانات بالتشفير بالمفتاح العام لأنه سيكون بطيئًا؛ لذلك يُستخدم التشفير المتماثل لتبادل البيانات بعد إنشاء المفاتيح.</div>`},
{h:"2) المصادقة في الخدمات الفعلية",html:`<p><b>المصادقة الثنائية (2FA)</b> تستخدم عاملين مستقلين من فئتين مختلفتين لإثبات الهوية. أما <b>المصادقة متعددة العوامل (MFA)</b> فتستخدم عاملين أو أكثر من فئات مثل: <b>المعرفة</b> (ما تعرفه)، <b>الحيازة</b> (ما تملكه)، <b>السمات الحيوية</b> (ما أنت عليه).</p><p>إذا كُشفت كلمة المرور، يقلل العامل المستقل الثاني احتمال الدخول غير المصرح به؛ فلا تكفي معرفة كلمة المرور وحدها.</p><div class="tw"><table><tr><th>الخدمة</th><th>المصادقة المستخدمة</th></tr><tr><td>الخدمات المصرفية</td><td>كلمة المرور (معرفة) + كلمة مرور لمرة واحدة (حيازة)</td></tr><tr><td>وسائل التواصل</td><td>كلمة المرور (معرفة) + رسالة SMS (حيازة)</td></tr><tr><td>مبنى مؤمَّن</td><td>بطاقة دخول (حيازة) + بصمة إصبع (سمات حيوية)</td></tr><tr><td>التسوق الإلكتروني</td><td>كلمة المرور (معرفة) + التحقق من هوية بطاقة الائتمان (حيازة)</td></tr></table></div><div class="box warn"><b class="t">انتبه</b>تعيين <b>كلمتي مرور</b> ليس مصادقة ثنائية، لأن كلتيهما من عامل «المعرفة» (هو مصادقة متعددة الخطوات بنفس العامل).</div>`},
{h:"3) تركيبات تقنيات الأمان",html:`<div class="tw"><table><tr><th>التقنية</th><th>التأثير</th></tr><tr><td>التشفير (بالمفتاح المتناظر/العام)</td><td>يمنع قراءة محتوى الاتصال من أطراف ثالثة</td></tr><tr><td>التوقيع الرقمي</td><td>يدعم التحقق من سلامة البيانات وهوية الموقّع، ويوفر دليلًا يدعم عدم التنصل</td></tr><tr><td>الشهادة الرقمية</td><td>تساعد المتصفح على التحقق من هوية الخادم واسم النطاق</td></tr><tr><td>المصادقة الثنائية 2FA</td><td>تقلل احتمال تسجيل الدخول غير المصرح به</td></tr></table></div><p><b>مثال التسوق الإلكتروني:</b> يبدأ اتصال HTTPS فيمنع التشفير قراءة المحتوى ← يتحقق المتصفح من الشهادة واسم النطاق ← تقلل 2FA الدخول غير المصرح به ← يحمي TLS الطلب أثناء النقل ← يُستخدم التوقيع الرقمي لإثبات التوقيع على بيانات محددة عند الحاجة.</p><div class="box imp"><b class="t">الفكرة الرئيسة</b>لا يأتي الأمان من تقنية واحدة، بل من الجمع بين التشفير والشهادات والتوقيعات والمصادقة لمعالجة تهديدات كثيرة في آن واحد (التنصت، التلاعب، انتحال الهوية، الدخول غير المصرح به) <b>دون ضمان مطلق</b>.</div><div class="box imp"><b class="t">توقّف وفكّر</b>إذا تسربت كلمة المرور، لماذا يمكن لعامل ثانٍ يُرسل إلى الهاتف أن يظل يحمي الحساب؟</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>مطابقة:</b> منع قراءة محتوى الاتصال ← التشفير. التحقق من أن رسالة موقّعة لم تُعدَّل وأنها من الموقّع المزعوم ← التوقيع الرقمي. التحقق من أن الطرف المقابل حقيقي ← الشهادة الرقمية.</p><div class="box imp"><b class="t">الخلاصة</b>يستخدم HTTPS بروتوكول HTTP عبر TLS؛ فتساعد الشهادات وآليات المفتاح العام على المصادقة وإنشاء مفاتيح الجلسة، ثم يحمي التشفير المتماثل البيانات بكفاءة. وتقلل 2FA الدخول غير المصرح به. والحماية الفعالة طبقات تقلل المخاطر ولا تعتمد على تقنية واحدة أو ضمان مطلق.</div>`}
],

goals:["اشرح أدوار جدار الحماية وVPN وDMZ وضوابط الأجهزة الطرفية في حماية الشبكة.","اشرح لماذا يوفر الدفاع في العمق حماية أقوى من الاعتماد على إجراء أمني واحد.","قيّم تصميمًا أمنيًا لشبكة وبرر اختيار الضوابط المناسبة وفق الأصول والتهديدات."],
secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>في الدرس السابق تعلمت حماية الاتصال والحسابات. هنا توسّع الحماية إلى <b>تصميم الشبكة نفسها</b>. تحتفظ شبكات المؤسسات ببيانات وخدمات مهمة قد يحاول مهاجم الوصول إليها، ولا تكفي وسيلة حماية واحدة؛ لذلك يُستخدم <b>الدفاع في العمق</b>.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>كيف يمكن لمؤسسة أن تصمم شبكتها بحيث، حتى لو اختُرق أحد الدفاعات، يظل النظام محميًا؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>أمان الشبكات القوي يأتي من تكديس الإجراءات (جدار الحماية، VPN، DMZ، حماية الأجهزة الطرفية) ومن التحقق من كل عملية وصول (نهج انعدام الثقة)، وليس من حاجز واحد.</div>`},
{h:"1) جدار الحماية",html:`<p><b>جدار الحماية</b> نظام أو برنامج يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية. قد يوجد عند حدود الشبكة أو بين أجزائها أو على جهاز مضيف.</p><div class="box imp"><b class="t">مثال من الكتاب</b>السماح بالوصول إلى خادم الويب مع منع الوصول الخارجي المباشر إلى قاعدة البيانات.</div>`},
{h:"2) الشبكة الافتراضية الخاصة (VPN)",html:`<p><b>VPN</b> اتصال أو شبكة منطقية خاصة عبر شبكة عامة مثل الإنترنت، وتستخدم عادة <b>التشفير وتقنيات النفق</b> لحماية البيانات بين الطرفين.</p><ul><li><b>العمل عن بُعد:</b> الاتصال بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل.</li><li><b>ربط الفروع:</b> ربط المكاتب في مواقع مختلفة بأمان.</li></ul><p>ولأن المحتوى يُشفَّر، تقل مخاطر التنصت حتى على شبكة Wi-Fi عامة.</p>`},
{h:"3) المنطقة المعزولة (DMZ)",html:`<p><b>DMZ</b> منطقة توضع فيها الخوادم المعرَّضة للشبكة الخارجية (خوادم الويب والبريد) <b>بشكل منفصل عن الشبكة الداخلية</b>. يقلل هذا احتمال وصول الهجوم إلى الشبكة الداخلية إذا اختُرق أحد هذه الخوادم.</p><div class="box warn"><b class="t">انتبه</b>DMZ ليست نظامًا يعرّض جميع الخوادم للخارج؛ بل تعزل الخوادم المواجهة للجمهور فقط.</div><div class="box imp"><b class="t">توقّف وفكّر</b>لماذا يكون وضع خادم ويب عام في DMZ أكثر أمانًا من وضعه داخل الشبكة الداخلية؟</div>`},
{h:"4) الدفاع في العمق",html:`<p><b>الدفاع في العمق</b>: استخدام طبقات متعددة من الضوابط الأمنية بحيث تساعد الطبقات الأخرى على تقليل الخطر والحد من أثر الاختراق إذا فشلت إحداها.</p><div class="tw"><table><tr><th>الطبقة</th><th>أمثلة</th></tr><tr><td>1: مدخل الشبكة</td><td>منع الاتصال غير المصرح به بجدار الحماية</td></tr><tr><td>2: مسار الاتصال</td><td>تشفير الاتصال بـ VPN</td></tr><tr><td>3: وضع الخوادم</td><td>فصل الخوادم العامة عن الداخلية بـ DMZ</td></tr><tr><td>4: الأجهزة الطرفية</td><td>برنامج مكافحة الفيروسات وتحديث نظام التشغيل</td></tr></table></div>`},
{h:"5) نهج انعدام الثقة (Zero Trust)",html:`<p>نهج أمني <b>لا يمنح الثقة تلقائيًا</b> لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة. تُفحص <b>الهوية والصلاحيات والسياق</b> عند طلب الوصول وفق سياسة المؤسسة.</p><p>صُمم الأمان التقليدي حول <b>المحيط الأمني</b> بفرضية «الداخل آمن والخارج خطر». ومع الخدمات السحابية والعمل عن بُعد أصبحت الحدود غير واضحة، فلم تعد حماية المحيط وحدها كافية.</p><div class="box imp"><b class="t">الفكرة الرئيسة</b>يكون أمان الشبكة أقوى عندما تُكدَّس الإجراءات في طبقات (الدفاع في العمق) ولا يُمنح أي وصول ثقة تلقائية (انعدام الثقة)، فيصعب أن يكشف خرق واحد النظام كله.</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>صح/خطأ:</b> جدار الحماية يتحكم في الاتصال وفق القواعد ○؛ VPN تقلل مخاطر التنصت على Wi-Fi العامة ○؛ DMZ نظام يعرّض جميع الخوادم ×؛ الدفاع في العمق تكديس إجراءات في طبقات ○.</p><div class="box imp"><b class="t">الخلاصة</b>كدّس دفاعاتك — جدار الحماية، VPN، DMZ، الأجهزة الطرفية — وتحقق من كل عملية وصول؛ فيصبح من غير المرجح أن يؤدي خرق واحد إلى كشف الشبكة بأكملها.</div>`}
],

c2l3:{desc:"المراحل الست للاستجابة للحوادث الأمنية، وتقييم المخاطر بالتأثير × الاحتمالية.",level:"متوسط",
topics:["ماهية الحادث الأمني","مراحل الاستجابة الست","تقييم المخاطر","ترتيب أولويات المعالجة"],
goals:["اشرح المراحل العامة للاستجابة للحوادث والغرض من كل مرحلة.","استخدم التأثير والاحتمالية لتحديد أولويات المخاطر في النموذج المبسط للدرس.","صمم استجابة مبررة لحادث أمني، واربط إجراءات الاستجابة بالضوابط الوقائية المناسبة."],
secs:[
{h:"مقدمة: سؤال الدرس",html:`<p>حتى مع تقنيات الحماية والدفاع في العمق، قد يقع حادث أمني؛ لذلك ينتقل هذا الدرس من الوقاية إلى الاستجابة وإدارة المخاطر. تستخدم المؤسسات خطة منظمة لوقف انتشار المشكلة، وإزالة التهديد، واستعادة الخدمة، ثم التعلم من الحادث وتحسين الحماية.</p><div class="box imp"><b class="t">السؤال الرئيسي</b>عندما يقع حادث أمني، كيف ينبغي للمؤسسة أن تنظّم استجابتها عبر مراحلها العامة، وكيف تقرر أي المخاطر تعالجها أولًا؟</div><div class="box imp"><b class="t">الفكرة الأساسية</b>تمثل مراحل الاستجابة الست تسلسلًا عامًا يساعد على التنظيم، مع إمكانية تداخل بعض الأنشطة أو العودة لمراحل سابقة. ويحدد تقييم المخاطر الأولويات بناءً على التأثير × الاحتمالية.</div>`},
{h:"1) ماهية الحادث الأمني",html:`<p><b>الحادث الأمني</b>: حدث يؤثر في <b>سرية المعلومات أو سلامتها أو توافرها</b>، أو يهددها بجدية، أو يخالف سياسة أمنية.</p><div class="tw"><table><tr><th>النوع</th><th>الوصف</th></tr><tr><td>تسرب المعلومات</td><td>تسرب المعلومات الشخصية أو السرية إلى الخارج</td></tr><tr><td>التلاعب بالبيانات</td><td>تعديل البيانات داخل نظام ما دون تصريح</td></tr><tr><td>انقطاع الخدمة</td><td>تصبح الخدمة غير متاحة بسبب هجمات على الخادم وغيرها</td></tr></table></div>`},
{h:"2) تدفق الاستجابة للحوادث (6 مراحل)",html:`<div class="tw"><table><tr><th>#</th><th>المرحلة</th><th>الوصف</th></tr><tr><td>1</td><td>التحضير</td><td>إنشاء إجراءات وهياكل استجابة مسبقًا، استعدادًا للحوادث</td></tr><tr><td>2</td><td>الاكتشاف</td><td>اكتشاف وتأكيد وقوع حادث</td></tr><tr><td>3</td><td>الاحتواء</td><td>تحديد نطاق التأثير بحيث لا ينتشر الضرر أكثر (عزل الجزء المتأثر)</td></tr><tr><td>4</td><td>إزالة التهديد (الاستئصال)</td><td>إزالة التهديد ومسبباته، مثل حذف البرمجيات الخبيثة ومعالجة الثغرة المستغلة</td></tr><tr><td>5</td><td>الاستعادة</td><td>إعادة الأنظمة والخدمات إلى حالة تشغيل آمنة وطبيعية (قد تشمل نسخة احتياطية سليمة)</td></tr><tr><td>6</td><td>الدروس المستفادة والتحسين</td><td>تحليل ما حدث وتوثيق الدروس وتحسين الضوابط لتقليل احتمال التكرار وأثره</td></tr></table></div><div class="box warn"><b class="t">انتبه</b>هذا نموذج تعليمي مبسط؛ قد يتداخل بعض الأنشطة أو يتكرر. مثلًا قد يكشف الاسترداد عن بقايا للتهديد تستلزم العودة إلى الاحتواء أو إزالة التهديد.</div><div class="box imp"><b class="t">توقّف وفكّر</b>لماذا يجب أن يأتي الاحتواء قبل الاستئصال في الاستجابة ذات المراحل الست؟</div>`},
{h:"3) مفهوم تقييم المخاطر",html:`<p><b>الخطر</b>: احتمال أن يقع حدث يسبب ضررًا، مع مراعاة احتمال وقوعه وحجم أثره. وفي هذا الدرس تُقدَّر درجة الخطر بطريقة مبسطة:</p><div class="box imp" style="text-align:center"><b class="t">درجة الخطر = درجة التأثير × درجة الاحتمالية</b></div><ul><li><b>التأثير:</b> حجم الضرر إذا وقع الحدث.</li><li><b>الاحتمالية:</b> مدى احتمال وقوع الحدث.</li></ul><p>تُعد المخاطر ذات <b>التأثير العالي والاحتمالية العالية</b> من أعلى الأولويات في هذا النموذج. أما ترتيب الحالات الأخرى فيعتمد على درجات المصفوفة والسياق والضوابط المتاحة.</p><div class="box warn"><b class="t">انتبه</b>لا يُحدَّد حجم المخاطرة بالتأثير وحده، ولا يمكن معالجة جميع المخاطر في الوقت نفسه.</div>`},
{h:"مثال محلول والخلاصة",html:`<p><b>مطابقة المراحل:</b> إنشاء إجراءات مسبقة ← التحضير؛ فصل حاسوب مصاب عن الشبكة ← الاحتواء؛ إزالة البرمجية الخبيثة ← الاستئصال؛ تحليل السبب وتحسين الضوابط ← الدروس المستفادة والتحسين.</p><div class="box imp"><b class="t">الخلاصة</b>اتبع التسلسل العام: تحضير ← اكتشاف ← احتواء ← استئصال ← استعادة ← الدروس المستفادة والتحسين، مع إمكانية التداخل أو العودة لمرحلة سابقة، وحدد أولويات المخاطر بناءً على التأثير × الاحتمالية.</div>`}
],

const s=S.get();s.last=id;S.set(s);const i=LESSONS.indexOf(l),nx=LESSONS[i+1];
return`<div id="lp"><i></i></div><p style="color:var(--a3);margin:0">الفصل ${l.u+1}: ${UNITS[l.u]}</p><h1>${l.t}</h1>
<div class="box imp"><b class="t">أهداف التعلم</b><ul style="margin:.3em 0">${c.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div>`+c.secs.map(x=>`<section class="sec rv"><h3>${x.h}</h3>${x.html}</section>`).join("")+`<section class="sec"><h3>اختبر نفسك</h3><p>${c.quiz.length} سؤالًا من الدرس مع تصحيح فوري.</p><a class="btn" href="#/quiz/${id}">ابدأ الاختبار القصير</a> <a class="btn g" href="#/practice">تدريبات الكتاب</a></section><p><button class="btn g" id="dn">${s.done[id]?"✓ تم إكمال الدرس":"تعليم الدرس كمكتمل"}</button> ${nx&&ready(nx.id)?`<a class="btn" href="#/lesson/${nx.id}">التالي →</a>`:'<button class="btn" disabled>التالي → (قريبًا)</button>'}</p>`}
function quiz(id){const c=CONTENT[id];if(!c)return nf();return`<h2>اختبار: ${L(id).t}</h2><div id="qz"></div>`}
function runQuiz(id){const Q=CONTENT[id].quiz,box=$("#qz");let i=0,ok=0;
function show(){if(i>=Q.length)return end();const q=Q[i],o=q.tf?["صح","خطأ"]:q.o;box.innerHTML=`<div class="pg"><i style="width:${i/Q.length*100}%"></i></div><p style="color:var(--mu)">سؤال ${i+1} من ${Q.length} — ${q.tf?"صح أم خطأ":"اختيار من متعدد"}</p><div class="card"><h3>${q.q}</h3>${o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join("")}<div id="fb"></div></div>`;
box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,good=k===q.a;if(good)ok++;box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});if(!good)b.classList.add("no");$("#fb").innerHTML=`<div class="box ${good?"imp":"warn"}"><b class="t">${good?"إجابة صحيحة ✓":"إجابة خاطئة ✗"}</b>${good?"":"الإجابة الصحيحة: "+o[q.a]+"<br>"}${q.w}</div><button class="btn" id="nq">${i+1<Q.length?"التالي":"عرض النتيجة"}</button>`;$("#nq").onclick=()=>{i++;show()}})}
function end(){const p=Math.round(ok/Q.length*100),lv=p>=90?"ممتاز 🏆":p>=75?"جيد جدًا 👏":p>=60?"جيد 👍":"يحتاج إلى مراجعة 📚";const s=S.get();s.quiz[id]={ok,total:Q.length,p};S.set(s);box.innerHTML=`<div class="card stat"><h2>${lv}</h2><b>${ok} / ${Q.length}</b>النسبة: ${p}%<br>صحيحة: ${ok} — خاطئة: ${Q.length-ok}<p><button class="btn" id="rt">إعادة الاختبار</button> <a class="btn g" href="#/lesson/${id}">مراجعة الدرس</a></p></div>`;$("#rt").onclick=()=>{i=0;ok=0;show()}}
show()}
function quizzes(){const s=S.get();return`<h2>الاختبارات</h2><div class="grid">`+LESSONS.map(l=>{const r=s.quiz[l.id];return`<div class="card rv"><span class="pill">${lname(l.id)}</span><h3>${l.t}</h3>${r?`<p>آخر نتيجة: ${r.ok}/${r.total} (${r.p}%)</p>`:""}${ready(l.id)?`<a class="btn" href="#/quiz/${l.id}">اختبار الدرس</a>`:'<button class="btn g" disabled>قريبًا</button>'}</div>`}).join("")+`</div><p style="color:var(--mu)">اختبار شامل لكل فصل واختبار نهائي سيُضافان بعد اكتمال الدروس.</p>`}
function practice(){return`<h2>التدريبات</h2><p style="color:var(--mu)">من تدريبات الكتاب. حاول أولًا ثم افتح الإجابة.</p>`+Object.keys(CONTENT).map(id=>`<h3 style="margin-top:20px">${lname(id)}: ${L(id).t}</h3>`+CONTENT[id].practice.map(([q,a],i)=>`<details class="rv"><summary>${i+1}. ${q}</summary><p>${a}</p></details>`).join("")).join("")}
function code(){return`<h2>مكتبة الأكواد</h2><input id="cq" class="ib" style="width:100%;padding:10px;text-align:right" placeholder="ابحث في الأكواد…">`+`<div id="cl">${codeList("")}</div>`}
function codeList(q){return CODES.filter(c=>(c.t+c.code+c.why).toLowerCase().includes(q.toLowerCase())).map((c,i)=>`<div class="card rv" style="margin:12px 0"><span class="pill">${lname(c.l)} (قريبًا)</span><h3>${c.t}</h3><button class="btn g cp" data-i="${CODES.indexOf(c)}">نسخ</button><pre>${esc(c.code)}</pre><p><b>الشرح:</b> ${c.why}</p></div>`).join("")||"<p>لا نتائج.</p>"}
function glossary(){return`<h2>قاموس المصطلحات</h2><div class="grid">`+GLOSS.map(g=>gcard(g)).join("")+"</div>"}
const gcard=g=>`<div class="card rv"><span class="en">${esc(g[0])}</span><h3>${g[1]}</h3><p>${g[2]}</p>${g[3]?`<p style="color:var(--mu)">مثال: ${esc(g[3])}</p>`:""}<a href="#/lesson/${g[4]}">${lname(g[4])}</a></div>`;
function about(){return`<h2>عن الموقع</h2><div class="card"><p>منصة تعليمية من <b>${CONFIG.name}</b> لشرح كتاب «البرمجة والذكاء الاصطناعي» للصف الثاني الثانوي (الجزء الأول). المحتوى مأخوذ من الكتاب، وأي إضافة من خارجه تحمل علامة <span class="pill">معلومة إضافية</span>.</p><p>الكتاب نفسه يتناول: تكنولوجيا المعلومات والمجتمع، الأمن السيبراني، تطبيقات الويب، وتصميم الويب والوسائط.</p></div>`}
function profile(){const s=S.get(),r=readyList(),d=r.filter(l=>s.done[l.id]).length,qs=Object.entries(s.quiz);return`<h2>الملف الشخصي</h2><div class="card"><div class="nm">${avatar()}<input id="pn" class="ib" style="padding:8px;min-width:200px" placeholder="اسمك" value="${esc(s.name||"")}"></div><p>تقدمك في المنهج — <b>${pct()}%</b></p><div class="pg"><i style="width:${pct()}%"></i></div><p>الدروس المكتملة: ${d} من ${r.length} متاحة<br>آخر درس: ${s.last?L(s.last).t:"—"}<br>اختبارات تم حلها: ${qs.length}</p>${qs.map(([k,v])=>`<p>• ${L(k).t}: ${v.ok}/${v.total} (${v.p}%)</p>`).join("")}</div>`}
function nf(){return`<div class="nf"><h1>404</h1><h2>الصفحة غير موجودة</h2><p><a class="btn" href="#/">العودة للرئيسية</a></p></div>`}
function search(q){q=decodeURIComponent(q).trim().toLowerCase();if(!q)return nf();const hit=(t)=>t.toLowerCase().includes(q);
const ls=LESSONS.filter(l=>ready(l.id)&&(hit(l.t)||CONTENT[l.id].secs.some(x=>hit(x.h+strip(x.html))))),gs=GLOSS.filter(g=>hit(g.join(" "))),cs=CODES.filter(c=>hit(c.t+c.code+c.why));
const qs=[];Object.keys(CONTENT).forEach(id=>CONTENT[id].quiz.forEach(x=>{if(hit(x.q+(x.o||[]).join(" ")))qs.push([id,x])}));
return`<h2>نتائج البحث: «${esc(q)}»</h2>`+(ls.length+gs.length+cs.length+qs.length?"":"<p>لا توجد نتائج.</p>")+(gs.length?`<h3>التعريف</h3><div class="grid">${gs.map(gcard).join("")}</div>`:"")+(ls.length?`<h3>الدروس</h3>${ls.map(l=>`<p><a href="#/lesson/${l.id}">${l.t}</a> — ${lname(l.id)}</p>`).join("")}`:"")+(cs.length?`<h3>الأكواد</h3>${cs.map(c=>`<pre>${esc(c.code)}</pre>`).join("")}`:"")+(qs.length?`<h3>الأسئلة</h3>${qs.map(([id,x])=>`<div class="card" style="margin:8px 0">${x.q}<br><a href="#/quiz/${id}">اذهب للاختبار</a></div>`).join("")}`:"")}

function route(){const h=location.hash||"#/",p=h.split("/"),r=p[1]||"";let out;
if(!r)out=home();else if(r==="curriculum")out=curriculum();else if(r==="lesson")out=lesson(p[2]);else if(r==="quiz")out=quiz(p[2]);else if(r==="quizzes")out=quizzes();else if(r==="practice")out=practice();else if(r==="code")out=code();else if(r==="glossary")out=glossary();else if(r==="about")out=about();else if(r==="profile")out=profile();else if(r==="search")out=search(p.slice(2).join("/"));else out=nf();
app.innerHTML=out;setNav(h);window.scrollTo(0,0);
if(r==="quiz"&&CONTENT[p[2]])runQuiz(p[2]);
const dn=$("#dn");if(dn)dn.onclick=()=>{const s=S.get();s.done[p[2]]=true;S.set(s);dn.textContent="✓ تم إكمال الدرس";toast("أحسنت! تم حفظ تقدمك")};
const cq=$("#cq");if(cq)cq.oninput=()=>{$("#cl").innerHTML=codeList(cq.value);bindCp()};bindCp();
const pn=$("#pn");if(pn)pn.oninput=()=>{const s=S.get();s.name=pn.value;S.set(s)};
document.title=CONFIG.name+" — "+CONFIG.siteTitle;reveal()}
function bindCp(){document.querySelectorAll(".cp").forEach(b=>b.onclick=()=>copy(CODES[+b.dataset.i].code))}
function reveal(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("in"));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});els.forEach(e=>io.observe(e))}
window.addEventListener("hashchange",route);
window.addEventListener("scroll",()=>{$("#top").style.display=scrollY>500?"block":"none";const lp=$("#lp i");if(lp){const m=document.documentElement.scrollHeight-innerHeight;lp.style.width=(m>0?scrollY/m*100:0)+"%"}},{passive:true});
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim())location.hash="#/search/"+encodeURIComponent(e.target.value.trim())});
(function(){let t=null;try{t=localStorage.getItem("hz_theme")}catch(e){}if(t)R.dataset.theme=t;$("#th").onclick=()=>{const n=(R.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))==="dark"?"light":"dark";R.dataset.theme=n;try{localStorage.setItem("hz_theme",n)}catch(e){}}})();
route();setTimeout(()=>{const l=$("#ld");l.style.opacity=0;setTimeout(()=>l.remove(),400)},350);
</script>
</body>
</html>
